name: Lint & Test

on:
  pull_request:

jobs:
  setup-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v7

      - name: Set up Node
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
      - run: npm ci

      - name: Upload node_modules
        uses: actions/upload-artifact@v7
        with:
          name: shared-dependencies
          path: node_modules/
  test:
    runs-on: ubuntu-latest
    needs: setup-deps
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shared-dependencies
          path: node_modules/

      - run: npm run test

  lint:
    runs-on: ubuntu-latest
    needs: setup-deps
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shared-dependencies
          path: node_modules/

      - run: npm run lint
